<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI Study Assistant — paste your notes or a topic and instantly generate interactive flashcards and practice quizzes."
    />
    <meta name="theme-color" content="#4f46e5" />
    <title>AI Study Assistant</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('studyMate.theme')
          var dark = stored !== 'light'
          if (dark) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
